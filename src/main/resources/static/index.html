<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students Manager</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input { padding: .4rem; }
  button { padding: .4rem .8rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
  #error { color: #b00020; min-height: 1.2rem; }
</style>
</head>
<body>
<h1>Students Manager</h1>
<form id="form">
  <input id="name" placeholder="Name" required>
  <input id="age" type="number" min="1" max="120" placeholder="Age" required>
  <input id="className" placeholder="Class" required>
  <button type="submit" id="submit">Add</button>
  <button type="button" id="cancel" hidden>Cancel</button>
</form>
<div id="error"></div>
<table>
  <thead><tr><th>Name</th><th>Age</th><th>Class</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const API = '/api/students';
const $ = id => document.getElementById(id);
let editingId = null;

async function request(url, options) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (!res.ok) {
    const problem = await res.json().catch(() => ({}));
    const details = problem.errors ? Object.entries(problem.errors).map(([k, v]) => k + ': ' + v).join(', ') : '';
    throw new Error(details || problem.detail || 'Request failed (' + res.status + ')');
  }
  return res.status === 204 ? null : res.json();
}

function showError(e) { $('error').textContent = e ? e.message : ''; }

async function load() {
  try {
    const students = await request(API);
    const rows = $('rows');
    rows.replaceChildren();
    for (const s of students) {
      const tr = document.createElement('tr');
      for (const v of [s.name, s.age, s.className]) {
        const td = document.createElement('td');
        td.textContent = v;
        tr.appendChild(td);
      }
      const actions = document.createElement('td');
      const edit = document.createElement('button');
      edit.textContent = 'Edit';
      edit.onclick = () => startEdit(s);
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.onclick = () => remove(s.id);
      actions.append(edit, ' ', del);
      tr.appendChild(actions);
      rows.appendChild(tr);
    }
    showError();
  } catch (e) { showError(e); }
}

function startEdit(s) {
  editingId = s.id;
  $('name').value = s.name;
  $('age').value = s.age;
  $('className').value = s.className;
  $('submit').textContent = 'Update';
  $('cancel').hidden = false;
}

function reset() {
  editingId = null;
  $('form').reset();
  $('submit').textContent = 'Add';
  $('cancel').hidden = true;
}

async function remove(id) {
  if (!confirm('Delete this student?')) return;
  try {
    await request(API + '/' + id, { method: 'DELETE' });
    if (editingId === id) reset();
    await load();
  } catch (e) { showError(e); }
}

$('cancel').onclick = reset;
$('form').onsubmit = async ev => {
  ev.preventDefault();
  const body = JSON.stringify({
    name: $('name').value,
    age: Number($('age').value),
    className: $('className').value
  });
  try {
    await request(editingId === null ? API : API + '/' + editingId,
      { method: editingId === null ? 'POST' : 'PUT', body });
    reset();
    await load();
  } catch (e) { showError(e); }
};

load();
</script>
</body>
</html>
